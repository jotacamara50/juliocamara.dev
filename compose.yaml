services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: juliocamara-portfolio:latest
    container_name: juliocamara-portfolio
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: juliocamara.dev,www.juliocamara.dev
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: juliocamara.dev,www.juliocamara.dev
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: edge-proxy
